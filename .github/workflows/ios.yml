# Builds the iOS app and, when asked, signs it and uploads it to TestFlight.
#
# The Xcode project is generated from ios/project.yml with XcodeGen. Every run
# builds for the simulator, which proves the code compiles. The TestFlight
# run follows the studio's macOS signing standard: its shared
# secrets (APPLE_TEAM_ID, ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID) plus the
# Apple Distribution certificate as APPLE_DIST_P12 / APPLE_DIST_PASSWORD,
# and an App Store Connect app record for com.amanorsac.easystems.
name: iOS
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false
# This account gets one macOS runner at a time, and a job left waiting is
# cancelled after a quarter of an hour, so the macOS jobs take turns.
concurrency:
  group: macos-runner
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    # Job-level, so the steps' if: conditions can see them. A step cannot
    # test its own env in its if:, which made the upload skip silently.
    env:
      TESTFLIGHT: ${{ inputs.testflight && 'yes' || '' }}
      APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
      APPLE_DIST_PASSWORD: ${{ secrets.APPLE_DIST_PASSWORD }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the signing secrets
        if: env.TESTFLIGHT == 'yes'
        run: |
          # Fail loudly: a secret this repository cannot see resolves to an
          # empty string, and a silent skip looks like success.
          missing=""
          for name in APPLE_DIST_P12 APPLE_DIST_PASSWORD ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Organisation secrets do not reach a repository owned by a personal account."
            exit 1
          fi
          for name in APPLE_DIST_P12 ASC_KEY_ID ASC_ISSUER_ID; do
            v="${!name}"; case "$v" in *.p12|*.p8|*.pem|*.b64) echo "::error::$name holds a filename, not the file's contents"; exit 1;; esac
          done
      - name: Pick the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: XcodeGen
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project EasyStems.xcodeproj -scheme EasyStems -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          grep -E "(error|warning): " build.log | grep -v "^warning: " | sort -u | head -80 || true
          tail -15 build.log
          exit "${status:-0}"
      - name: Import the distribution certificate
        if: env.TESTFLIGHT == 'yes'
        run: |
          KEYCHAIN=build.keychain; KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          echo "$APPLE_DIST_P12" | tr -d '[:space:]' | base64 --decode > dist.p12
          trim () { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          security import dist.p12 -k "$KEYCHAIN" -P "$(trim "$APPLE_DIST_PASSWORD")" -T /usr/bin/codesign -T /usr/bin/security
          rm -f dist.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Apple Distribution" || { echo "::error::No Apple Distribution identity landed in the keychain"; exit 1; }
      - name: Archive, sign and upload to TestFlight
        if: env.TESTFLIGHT == 'yes'
        run: |
          cd ios
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > asc.p8; else printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > asc.p8; fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$PWD/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project EasyStems.xcodeproj -scheme EasyStems -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/EasyStems.xcarchive "${AUTH[@]}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive > archive.log 2>&1 || status=$?
          grep -E "error: |warning: .*(sign|profile|certificate)" archive.log | sort -u | head -60 || true
          tail -15 archive.log
          [ -z "${status:-}" ] || exit "$status"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/EasyStems.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" > export.log 2>&1 || status=$?
          grep -E "error|Upload|uploaded|EXPORT" export.log | sort -u | head -60 || true
          tail -15 export.log
          rm -f asc.p8
          [ -z "${status:-}" ] || exit "$status"
          echo "Uploaded build ${{ github.run_number }}. It shows in App Store Connect under TestFlight once Apple has processed it."

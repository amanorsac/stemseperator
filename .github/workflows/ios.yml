# Builds the iOS app and, when the studio's App Store secrets are present and
# the run asks for it, uploads it to TestFlight.
#
# The Xcode project is generated from ios/project.yml with XcodeGen. Every run
# builds for the simulator, which proves the code compiles. The TestFlight
# step needs: IOS_DIST_P12 and IOS_DIST_PASSWORD (an "Apple Distribution"
# certificate as a base64 .p12, built the way the macOS signing standard
# describes), ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID and APPLE_TEAM_ID, and an
# app record in App Store Connect with the bundle id com.amanorsac.easystems.
name: iOS
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight (needs the App Store secrets)"
        type: boolean
        default: false
# This account gets one macOS runner at a time, and a job left waiting is
# cancelled after a quarter of an hour, so the macOS jobs take turns.
concurrency:
  group: macos-runner
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: XcodeGen
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project EasyStems.xcodeproj -scheme EasyStems -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          grep -E "(error|warning): " build.log | grep -v "^warning: " | sort -u | head -80 || true
          tail -15 build.log
          exit "${status:-0}"
      - name: Import the distribution certificate
        if: ${{ inputs.testflight && env.IOS_DIST_P12 != '' }}
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_PASSWORD: ${{ secrets.IOS_DIST_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain; KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          echo "$IOS_DIST_P12" | tr -d '[:space:]' | base64 --decode > dist.p12
          trim () { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          security import dist.p12 -k "$KEYCHAIN" -P "$(trim "$IOS_DIST_PASSWORD")" -T /usr/bin/codesign -T /usr/bin/security
          rm -f dist.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning
      - name: Archive, sign and upload to TestFlight
        if: ${{ inputs.testflight && env.ASC_KEY_P8 != '' }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          mkdir -p ~/.appstoreconnect/private_keys
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s' "$ASC_KEY_P8" > asc.p8; else printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > asc.p8; fi
          cp asc.p8 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcodebuild -project EasyStems.xcodeproj -scheme EasyStems -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/EasyStems.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$PWD/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM="$APPLE_TEAM_ID" archive | tail -30
          test "${PIPESTATUS[0]}" -eq 0
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/EasyStems.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$PWD/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -30
          test "${PIPESTATUS[0]}" -eq 0
          rm -f asc.p8

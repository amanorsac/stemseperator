# Builds Easy Stems on real Windows and macOS runners.
#
# Every push to main produces downloadable artifacts under the run. Pushing a
# tag like v0.1.0 also publishes a Release with the installers attached.
# Signing and notarisation run only when the studio's certificates are in
# the repository's secrets; without them the build is an unsigned test build.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install
        shell: bash
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Build installer
        shell: bash
        env:
          # electron-builder signs when these are set; skipped otherwise.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: EasyStems-Windows
          path: installer/*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Build disk image
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Without a certificate, build unsigned rather than fail.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: EasyStems-macOS
          path: installer/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/EasyStems-Windows/*.exe
            out/EasyStems-macOS/*.dmg
          generate_release_notes: true

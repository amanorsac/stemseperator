# Builds Easy Stems on real Windows and macOS runners.
#
# Every push to main produces downloadable artifacts under the run. A tag
# like v0.1.0, a branch like release/v0.1.0, or a manual run with a release
# name also publishes a Release with the installers attached.
#
# Signing and notarisation run only when the studio's certificates are in
# the repository's secrets; without them the build is an unsigned test build.
# The secrets are exported only when non-empty: an empty CSC_LINK is still
# "set" to electron-builder, which then tries to open "" as a certificate.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a Release under this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install
        shell: bash
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Build installer
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$PFX" ]; then export CSC_LINK="$PFX" CSC_KEY_PASSWORD="$PFX_PASSWORD"; fi
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: EasyStems-Windows
          path: installer/*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Build disk image
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$P12" ]; then
            export CSC_LINK="$P12" CSC_KEY_PASSWORD="$P12_PASSWORD"
            if [ -n "$NOTARY_APPLE_ID" ]; then
              export APPLE_ID="$NOTARY_APPLE_ID" APPLE_TEAM_ID="$NOTARY_TEAM_ID" APPLE_APP_SPECIFIC_PASSWORD="$NOTARY_PASSWORD"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac dmg --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: EasyStems-macOS
          path: installer/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Release name
        id: name
        env:
          REQUESTED: ${{ inputs.release }}
        run: |
          if [ -n "$REQUESTED" ]; then echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT";
          else echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            out/EasyStems-Windows/*.exe
            out/EasyStems-macOS/*.dmg
          generate_release_notes: true

# XcodeGen spec for the iOS app. The Xcode project is generated from this in
# CI (and locally with `xcodegen generate`), so nothing binary is committed.
name: EasyStems
options:
  bundleIdPrefix: com.amanorsac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.19.0
targets:
  EasyStems:
    type: application
    platform: iOS
    sources:
      - path: EasyStems
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amanorsac.easystems
        PRODUCT_NAME: Easy Stems
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: SGQVTNFK4Q
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EasyStems/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
